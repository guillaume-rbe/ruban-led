<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ruban LED">
<meta name="theme-color" content="#0F1114">
<title>Ruban LED</title>
<style>
  :root { --bg:#0F1114; --card:#1B1E23; --line:#2A2F36; --text:#ECEFF1; --muted:#9AA3AD;
          --accent:#E53935; --ok:#43A047; --warn:#FFB300; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         padding:calc(12px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font-size:22px; margin:4px 2px 14px; display:flex; align-items:center; gap:10px; }
  h1 small { font-size:13px; color:var(--muted); font-weight:500; margin-left:auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px 16px; margin-bottom:14px; }
  .card h2 { font-size:12px; letter-spacing:.08em; color:var(--muted); margin:0 0 10px; font-weight:700; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--muted); display:inline-block; flex:none; }
  .row { display:flex; align-items:center; gap:10px; }
  .muted { color:var(--muted); font-size:15px; }
  .warn { color:var(--warn); font-weight:600; font-size:15px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1.7fr; gap:8px; }
  .grid3 button { white-space:nowrap; padding:13px 4px; }
  button { font:inherit; font-size:15px; color:var(--text); background:#262A31; border:1px solid var(--line);
           border-radius:12px; padding:13px 8px; min-height:50px; width:100%; }
  button:active { background:#333944; }
  button.primary { background:var(--accent); border-color:var(--accent); font-weight:600; }
  button.ghost { background:transparent; margin-top:8px; min-height:42px; padding:8px; color:var(--muted); }
  .panel + .panel { border-top:1px solid var(--line); margin-top:14px; padding-top:14px; }
  .panel .head { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  .swatch { width:44px; height:44px; border-radius:10px; flex:none; border:1px solid var(--line); }
  label.s { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:30px; border-radius:15px;
                      border:1px solid var(--line); margin:0; background:#262A31; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:30px; height:30px; border-radius:50%;
                      background:#fff; border:3px solid #0008; box-shadow:0 1px 4px #000a; }
  input.hue { background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); }
  .switch { display:flex; align-items:center; gap:12px; padding:9px 0; border-top:1px solid var(--line); }
  .switch:first-of-type { border-top:none; }
  .switch > span:first-child { flex:1; min-width:0; }
  .switch small { display:block; color:var(--muted); font-size:13px; }
  .tog { position:relative; width:52px; height:32px; flex:none; }
  .tog input { opacity:0; width:0; height:0; }
  .tog i { position:absolute; inset:0; background:#3A3F47; border-radius:16px; transition:.2s; }
  .tog i:before { content:""; position:absolute; width:26px; height:26px; left:3px; top:3px; background:#fff;
                  border-radius:50%; transition:.2s; }
  .tog input:checked + i { background:var(--ok); }
  .tog input:checked + i:before { transform:translateX(20px); }
  .nightbox { padding:4px 0 6px; }
  .nums { display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; }
  .nums label { font-size:13px; color:var(--muted); }
  .nums input { display:block; width:100%; margin-top:4px; font:inherit; font-size:17px; color:var(--text);
                background:#262A31; border:1px solid var(--line); border-radius:10px; padding:10px; }
  pre { margin:0; white-space:pre-wrap; font:13px/1.4 ui-monospace, Menlo, monospace; color:var(--muted); }
  #offline { display:none; background:#5a1d1d; color:#fff; border-radius:12px; padding:10px 14px; margin-bottom:14px; font-size:15px; }
  .hidden { display:none; }
</style>
</head>
<body>
<h1><span class="dot" id="dot"></span>Ruban LED<small id="seen"></small></h1>
<div id="offline">Écran injoignable : l'iPhone est-il connecté à CarPlay ?</div>

<div class="card">
  <h2>ÉTAT</h2>
  <div class="row"><b id="link">…</b></div>
  <div class="muted" id="strip"></div>
  <div class="muted" id="doors"></div>
  <div class="warn" id="rule"></div>
  <div class="muted" id="presence"></div>
</div>

<div class="card">
  <h2>ACTIONS</h2>
  <div class="grid3">
    <button data-do="on">Allumer</button>
    <button data-do="off">Éteindre</button>
    <button data-do="default" class="primary">Couleur permanente</button>
  </div>
  <button class="ghost" id="testsBtn">Boutons de test ▸</button>
  <div class="grid hidden" id="tests" style="margin-top:8px">
    <button data-do="intro">Animation d'allumage</button>
    <button data-do="exit">Animation d'extinction</button>
    <button data-do="blink">Clignotement d'alerte</button>
    <button data-do="hold">Animations à l'arrêt</button>
  </div>
</div>

<div class="card">
  <h2>COULEURS</h2>
  <div class="panel" id="steady" data-t="steady"></div>
  <div class="panel" id="anim" data-t="anim"></div>
</div>

<div class="card">
  <h2>RÈGLES</h2>
  <div id="rules"></div>
</div>

<div class="card">
  <h2>DERNIERS ÉVÉNEMENTS</h2>
  <pre id="events">—</pre>
</div>

<script>
"use strict";
// the code is the first part of the path: http://<dash>:8080/<code>
const BASE = "/" + location.pathname.split("/")[1] + "/";
const RULES = [
  ["intro", "Animations ×3", "Allumage au déverrouillage, extinction au verrouillage"],
  ["holdAnim", "Animation à l'arrêt", "Arrêté en D après avoir roulé : une fois sur N, une animation au hasard"],
  ["apFlash", "Bleu à l'activation de l'Autosteer", "1 s dans le bleu de l'Autopilot"],
  ["reverseWhite", "Blanc en marche arrière", "Un blanc qui respire, un peu plus fort que la couleur permanente"],
  ["doorBlink", "Alerte à l'ouverture", "Le ruban clignote dans la couleur d'alerte quand une portière, le coffre ou le frunk s'ouvre"],
  ["hazard", "Clignoter avec les warnings", ""],
  ["autoPlay", "Musique à la connexion CarPlay", "Relance la dernière appli audio de l'iPhone"],
  ["night", "Mode nuit", ""],
];
const $ = id => document.getElementById(id);

function post(path) {
  return fetch(BASE + path, { method: "POST", cache: "no-store" }).catch(() => {});
}

// ---- actions
document.querySelectorAll("button[data-do]").forEach(b =>
  b.addEventListener("click", () => post("action?do=" + b.dataset.do)));
$("testsBtn").addEventListener("click", () => {
  const t = $("tests"), show = t.classList.contains("hidden");
  t.classList.toggle("hidden", !show);
  $("testsBtn").textContent = show ? "Boutons de test ▾" : "Boutons de test ▸";
});

// ---- colour panels
function hsvCss(h, s, v) {
  s /= 100; const f = n => { const k = (n + h / 60) % 6; return v * (1 - s * Math.max(0, Math.min(k, 4 - k, 1))); };
  return `rgb(${Math.round(f(5) * 255)},${Math.round(f(3) * 255)},${Math.round(f(1) * 255)})`;
}
const panels = {};
function makePanel(el, title) {
  el.innerHTML = `<div class="head"><div class="swatch"></div><div><b>${title}</b>
      <div class="muted pct"></div></div></div>
    <label class="s">Teinte</label><input type="range" class="hue" min="0" max="359">
    <label class="s">Saturation</label><input type="range" class="sat" min="0" max="100">
    <label class="s">Luminosité</label><input type="range" class="val" min="1" max="100">`;
  const p = { el, t: el.dataset.t, hue: el.querySelector(".hue"), sat: el.querySelector(".sat"),
              val: el.querySelector(".val"), sw: el.querySelector(".swatch"), pct: el.querySelector(".pct"),
              editedAt: 0, lastSent: 0, timer: null };
  const draw = () => {
    const h = +p.hue.value, s = +p.sat.value, v = +p.val.value;
    p.sw.style.background = hsvCss(h, s, 0.25 + 0.75 * v / 100);
    p.sat.style.background = `linear-gradient(to right,#fff,${hsvCss(h, 100, 1)})`;
    p.val.style.background = `linear-gradient(to right,#000,${hsvCss(h, s, 1)})`;
    p.pct.textContent = "Luminosité " + v + " %";
  };
  const send = () => {
    p.lastSent = Date.now();
    post(`colour?t=${p.t}&h=${p.hue.value}&s=${p.sat.value}&p=${p.val.value}`);
  };
  [p.hue, p.sat, p.val].forEach(r => {
    r.addEventListener("input", () => {
      p.editedAt = Date.now(); draw();
      // while dragging: at most one change every 150 ms, like the app
      clearTimeout(p.timer);
      if (Date.now() - p.lastSent > 150) send(); else p.timer = setTimeout(send, 150);
    });
    r.addEventListener("change", () => { p.editedAt = Date.now(); clearTimeout(p.timer); send(); });
  });
  p.draw = draw;
  panels[p.t] = p;
}
makePanel($("steady"), "Permanente");
makePanel($("anim"), "Alertes (portes, coffre, frunk, warnings)");

// ---- rules
const switches = {};
RULES.forEach(([k, title, sub]) => {
  const row = document.createElement("label");
  row.className = "switch";
  row.innerHTML = `<span>${title}<small>${sub}</small></span><span class="tog"><input type="checkbox"><i></i></span>`;
  const box = row.querySelector("input");
  box.addEventListener("change", () => { switches[k].editedAt = Date.now(); post(`rule?k=${k}&v=${box.checked ? 1 : 0}`); });
  switches[k] = { box, sub: row.querySelector("small"), editedAt: 0 };
  $("rules").appendChild(row);
});

// ---- night hours and brightness, behind a button like the app
const night = document.createElement("div");
night.innerHTML = `<button class="ghost" id="nightBtn">Horaires et luminosité ▸</button>
  <div class="nightbox hidden" id="nightBox">
    <div class="nums">
      <label>Début hiver (h)<input id="nw" type="number" inputmode="numeric" min="0" max="23"></label>
      <label>Début été (h)<input id="ns" type="number" inputmode="numeric" min="0" max="23"></label>
      <label>Fin (h)<input id="ne" type="number" inputmode="numeric" min="0" max="23"></label>
      <label>Luminosité (%)<input id="np" type="number" inputmode="numeric" min="1" max="100"></label>
    </div>
    <button class="primary" id="nightSave" style="margin-top:10px">Enregistrer les horaires</button>
  </div>`;
$("rules").appendChild(night);
let nightEditedAt = 0;
["nw", "ns", "ne", "np"].forEach(id => $(id).addEventListener("input", () => nightEditedAt = Date.now()));
$("nightBtn").addEventListener("click", () => {
  const box = $("nightBox"), show = box.classList.contains("hidden");
  box.classList.toggle("hidden", !show);
  $("nightBtn").textContent = show ? "Horaires et luminosité ▾" : "Horaires et luminosité ▸";
});
$("nightSave").addEventListener("click", async () => {
  const v = id => Math.round(+$(id).value || 0);
  await post(`night?w=${v("nw")}&s=${v("ns")}&e=${v("ne")}&p=${v("np")}`);
  nightEditedAt = 0;
  $("nightSave").textContent = "Enregistré ✓";
  setTimeout(() => $("nightSave").textContent = "Enregistrer les horaires", 1500);
  refresh();
});

// ---- state, every 2 s
function setPanel(p, hsv) {
  if (Date.now() - p.editedAt < 3000) return;    // being moved: don't jump back
  [p.hue.value, p.sat.value, p.val.value] = hsv;
  p.draw();
}
async function refresh() {
  try {
    const r = await fetch(BASE + "state", { cache: "no-store" });
    if (!r.ok) throw 0;
    const s = await r.json();
    $("offline").style.display = "none";
    $("link").textContent = s.link;
    const ok = s.link === "Ruban connecté";
    $("dot").style.background = ok ? "var(--ok)" : s.link.startsWith("Service") ? "var(--muted)" : "var(--warn)";
    $("strip").textContent = s.strip;
    $("doors").textContent = s.doors;
    $("rule").textContent = s.rule;
    $("presence").textContent = s.presence;
    $("events").textContent = s.events || "—";
    setPanel(panels.steady, s.steady);
    setPanel(panels.anim, s.anim);
    for (const k in switches) {
      if (Date.now() - switches[k].editedAt > 3000) switches[k].box.checked = !!s.rules[k];
    }
    switches.night.sub.textContent = s.night;
    const focused = ["nw", "ns", "ne", "np"].includes(document.activeElement && document.activeElement.id);
    if (!focused && Date.now() - nightEditedAt > 60000) {
      [$("nw").value, $("ns").value, $("ne").value, $("np").value] = s.nightVals;
    }
    $("seen").textContent = new Date().toLocaleTimeString("fr-FR");
  } catch (e) {
    $("offline").style.display = "block";
    $("dot").style.background = "var(--accent)";
  }
}
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 2000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
